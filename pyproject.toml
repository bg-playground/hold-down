[project]
name = "hold-down"
version = "0.2.0"
description = "Fail-closed launch viewing gate. A navigation intent is released only after an independent constraint check."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Brad Guider" }]

[project.scripts]
hold-down = "holddown.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
